<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Finder</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #0c0e14;
  color: #e2e8f0;
  min-height: 100vh;
  padding: 44px 24px 80px;
}

.container { max-width: 740px; margin: 0 auto; }

header { margin-bottom: 32px; }

h1 { font-size: 20px; font-weight: 700; color: #f8fafc; letter-spacing: -0.5px; margin-bottom: 5px; }

.tagline { font-size: 12px; color: #3a4a5e; line-height: 1.7; }
.kw {
  background: #151b27; border: 1px solid #1e2a3a;
  border-radius: 4px; padding: 1px 6px;
  font-family: monospace; font-size: 11px; color: #4a5a6e;
}

/* Search */
.search-row { display: flex; gap: 8px; margin-bottom: 12px; }

input[type="text"] {
  flex: 1;
  background: #101420;
  border: 1.5px solid #1a2234;
  border-radius: 10px;
  color: #f1f5f9;
  font-size: 20px;
  font-weight: 600;
  padding: 12px 16px;
  outline: none;
  letter-spacing: -0.3px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.09); }
input::placeholder { color: #1e2a3a; font-weight: 400; }

.btn {
  background: #10b981; border: none; border-radius: 10px;
  color: #fff; cursor: pointer;
  font-size: 14px; font-weight: 700; letter-spacing: 0.2px;
  padding: 12px 22px;
  transition: background 0.12s, transform 0.1s;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: #0ea472; transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { background: #151b27; color: #252f3e; cursor: default; transform: none; }

/* Filters */
.filters { display: flex; gap: 5px; margin-bottom: 22px; flex-wrap: wrap; }
.pill {
  background: transparent; border: 1px solid #1a2234;
  border-radius: 20px; color: #364455;
  cursor: pointer; font-size: 11px; font-weight: 500;
  padding: 4px 11px; transition: all 0.12s; user-select: none;
}
.pill:hover { border-color: #2a3a4e; color: #5a7080; }
.pill.active { border-color: #10b981; color: #10b981; background: rgba(16,185,129,0.07); }

/* Status */
.status-bar {
  font-size: 12px; color: #364455;
  margin-bottom: 18px; min-height: 20px;
  display: flex; align-items: center; gap: 7px;
}
.spinner { width: 5px; height: 5px; border-radius: 50%; background: #10b981; animation: blink 1s ease infinite; flex-shrink: 0; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }
.hl { color: #10b981; font-weight: 600; }
.hl-amber { color: #f59e0b; font-weight: 600; }
.hl-red { color: #ef4444; font-weight: 600; }
.dim { color: #1e2a3a; }

/* Sections */
.section {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.4px; margin: 24px 0 9px;
  display: flex; align-items: center; gap: 7px;
}
.section:first-child { margin-top: 0; }
.section .n { border-radius: 4px; font-size: 10px; font-weight: 700; padding: 1px 6px; }
.s-green { color: #10b981; }
.s-green .n { background: rgba(16,185,129,0.1); color: #10b981; }
.s-amber { color: #d97706; }
.s-amber .n { background: rgba(217,119,6,0.1); color: #d97706; }
.s-red { color: #b91c1c; }
.s-red .n { background: rgba(185,28,28,0.1); color: #b91c1c; }
.s-slate { color: #252f3e; }
.s-slate .n { background: #151b27; color: #252f3e; }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 6px; }

.card {
  border-radius: 9px; padding: 11px 13px;
  border: 1.5px solid transparent; background: #101420;
  animation: up 0.15s ease both;
  transition: border-color 0.15s, transform 0.1s;
  cursor: default;
  position: relative;
}
@keyframes up { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

/* Both free — green */
.card.c-both { background: #071210; border-color: #0c4028; cursor: pointer; }
.card.c-both:hover { border-color: #10b981; transform: translateY(-1px); }
.card.c-both .name { color: #10b981; }

/* One free — amber */
.card.c-one { background: #110e07; border-color: #382406; cursor: pointer; }
.card.c-one:hover { border-color: #d97706; transform: translateY(-1px); }
.card.c-one .name { color: #f59e0b; }

/* Checking */
.card.c-chk { border-color: #1a2234; }
.card.c-chk .name { color: #252f3e; }

/* Taken — red */
.card.c-taken { background: #0f0909; border-color: #2a0e0e; }
.card.c-taken:hover { border-color: #5c1a1a; }
.card.c-taken .name { color: #5c1a1a; }

.name { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; margin-bottom: 8px; }

/* Copy toast */
.copied-toast {
  position: absolute; top: 8px; right: 9px;
  font-size: 10px; font-weight: 700; color: #10b981;
  background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.2);
  border-radius: 4px; padding: 1px 7px;
  opacity: 0; transform: translateY(-2px);
  transition: opacity 0.15s, transform 0.15s;
  pointer-events: none;
}
.copied-toast.show { opacity: 1; transform: translateY(0); }

/* TLD badges */
.tlds { display: flex; gap: 5px; flex-wrap: wrap; }
.tld {
  display: flex; align-items: center; gap: 4px;
  border-radius: 5px; font-size: 11px; font-weight: 600;
  padding: 2px 7px; border: 1px solid transparent;
}
.tld.free    { background: rgba(16,185,129,0.09); border-color: rgba(16,185,129,0.22); color: #10b981; }
.tld.taken   { background: rgba(140,20,20,0.12); border-color: #3a1212; color: #6b2020; }
.tld.loading { background: transparent; border-color: #1a2234; color: #252f3e; }
.tld.err     { background: rgba(200,30,30,0.06); border-color: #3a1a1a; color: #7f1d1d; }
.dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.tld.free   .dot { background: #10b981; }
.tld.taken  .dot { background: #6b2020; }
.tld.loading .dot { background: #252f3e; animation: blink 0.9s infinite; }
.tld.err    .dot { background: #7f1d1d; }

/* Empty */
.empty { text-align: center; padding: 64px 0 40px; color: #1a2234; }
.empty .ico { font-size: 30px; margin-bottom: 10px; }
.empty p { font-size: 14px; color: #252f3e; }
.empty small { font-size: 12px; color: #151b27; display: block; margin-top: 5px; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Name Finder</h1>
    <p class="tagline">
      Real word → brand variations → .com + .io checked live. Click any free name to copy.<br>
      Try: <span class="kw">pulse</span> <span class="kw">drift</span> <span class="kw">sense</span>
      <span class="kw">trace</span> <span class="kw">bloom</span> <span class="kw">scout</span>
      <span class="kw">arc</span> <span class="kw">flux</span>
    </p>
  </header>

  <div class="search-row">
    <input type="text" id="word" placeholder="Enter a word…" autofocus spellcheck="false">
    <button class="btn" id="goBtn" onclick="run()">Check</button>
  </div>

  <div class="filters">
    <button class="pill active" onclick="setF('all',this)">All</button>
    <button class="pill" onclick="setF('both',this)">Both free</button>
    <button class="pill" onclick="setF('any',this)">Any free</button>
    <button class="pill" onclick="setF('com',this)">.com free</button>
    <button class="pill" onclick="setF('io',this)">.io free</button>
    <button class="pill" onclick="setF('short',this)">≤ 7 chars</button>
  </div>

  <div class="status-bar" id="status"></div>

  <div id="out">
    <div class="empty">
      <div class="ico">⌨</div>
      <p>Type a word above</p>
      <small>Checks .com + .io via RDAP · click a free name to copy</small>
    </div>
  </div>

</div>
<script>
let f = 'all', rows = [], live = false, sse = null;

function setF(v, btn) {
  f = v;
  document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function filtered() {
  return rows.filter(r => {
    const cf = r.com?.available === true, iof = r.io?.available === true;
    if (f === 'both')  return cf && iof;
    if (f === 'any')   return cf || iof;
    if (f === 'com')   return cf;
    if (f === 'io')    return iof;
    if (f === 'short') return r.name.length <= 7;
    return true;
  });
}

function render() {
  const out = document.getElementById('out');
  if (rows.length === 0) {
    out.innerHTML = `<div class="empty"><div class="ico">⌨</div><p>Type a word above</p><small>Checks .com + .io via RDAP · click a free name to copy</small></div>`;
    return;
  }
  const items = filtered();
  const both  = items.filter(r => r.com?.available && r.io?.available);
  const one   = items.filter(r => (r.com?.available || r.io?.available) && !(r.com?.available && r.io?.available));
  const chk   = items.filter(r => r._state === 'chk');
  const taken = items.filter(r => r._state === 'done' && !r.com?.available && !r.io?.available);

  let h = '';
  if (both.length)  h += sec('Both free', both.length, 's-green') + grid(both);
  if (one.length)   h += sec('One free',  one.length,  's-amber')  + grid(one);
  if (chk.length  && f === 'all') h += sec('Checking…', chk.length, 's-slate') + grid(chk);
  if (taken.length && f === 'all') h += sec('Taken', taken.length, 's-red')   + grid(taken);
  if (!h) h = `<div class="empty" style="padding:36px 0"><p>Nothing matches this filter</p></div>`;
  out.innerHTML = h;
}

function sec(label, n, cls) {
  return `<div class="section ${cls}">${label}<span class="n">${n}</span></div>`;
}
function grid(items) {
  return `<div class="grid">${items.map(card).join('')}</div>`;
}

function card(r) {
  const cf = r.com?.available === true, iof = r.io?.available === true;
  const isFree = cf || iof;
  let cls = 'card ';
  if (r._state === 'chk') cls += 'c-chk';
  else if (cf && iof)     cls += 'c-both';
  else if (cf || iof)     cls += 'c-one';
  else                    cls += 'c-taken';

  // Best domain to copy: prefer .com, then .io
  const copyDomain = cf ? r.name + '.com' : iof ? r.name + '.io' : '';
  const clickAttr  = isFree && r._state !== 'chk'
    ? `onclick="copyDomain('${r.name}', this)"` : '';
  const title = isFree ? ` title="Click to copy ${copyDomain}"` : '';

  return `<div class="${cls}" ${clickAttr}${title}>
    <div class="copied-toast" id="toast-${r.name}">Copied!</div>
    <div class="name">${x(r.name)}</div>
    <div class="tlds">
      ${badge('.com', r.com, r._state === 'chk')}
      ${badge('.io',  r.io,  r._state === 'chk')}
    </div>
  </div>`;
}

function badge(tld, info, checking) {
  if (checking || !info) return `<span class="tld loading"><span class="dot"></span>${tld}</span>`;
  if (info.available === true) return `<span class="tld free"><span class="dot"></span>${tld}</span>`;
  if (info.error) return `<span class="tld err" title="${x(info.error)}"><span class="dot"></span>${tld}</span>`;
  return `<span class="tld taken"><span class="dot"></span>${tld}</span>`;
}

function copyDomain(name, cardEl) {
  const r = rows.find(r => r.name === name);
  if (!r) return;
  const domain = r.com?.available ? name + '.com' : name + '.io';
  navigator.clipboard.writeText(domain).then(() => {
    const toast = cardEl.querySelector('.copied-toast') || document.getElementById('toast-' + name);
    if (!toast) return;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1400);
  });
}

function x(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function setStatus(html) { document.getElementById('status').innerHTML = html; }

async function run() {
  const word = document.getElementById('word').value.trim();
  if (!word || live) return;
  if (sse) { sse.close(); sse = null; }

  live = true;
  document.getElementById('goBtn').disabled = true;
  document.getElementById('goBtn').textContent = 'Checking…';
  rows = [];
  setStatus('<span class="spinner"></span> Generating variants…');
  render();

  const res = await fetch(`/generate?word=${encodeURIComponent(word)}`);
  const { variants } = await res.json();

  rows = variants.map(n => ({ name: n, com: null, io: null, _state: 'chk' }));
  setStatus(`<span class="spinner"></span> Checking <span class="hl">0</span><span class="dim"> / ${variants.length}</span>`);
  render();

  let done = 0;
  sse = new EventSource(`/check-stream?words=${encodeURIComponent(variants.join(','))}`);

  sse.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.done) {
      sse.close(); sse = null; live = false;
      document.getElementById('goBtn').disabled = false;
      document.getElementById('goBtn').textContent = 'Check';
      const both   = rows.filter(r => r.com?.available && r.io?.available).length;
      const any    = rows.filter(r => r.com?.available || r.io?.available).length;
      const taken  = rows.filter(r => r._state === 'done' && !r.com?.available && !r.io?.available).length;
      setStatus(
        both  ? `<span class="hl">${both} both free</span> · <span class="hl-amber">${any-both} one free</span> · <span class="hl-red">${taken} taken</span>`
              : any
                ? `<span class="hl-amber">${any} one free</span> · <span class="hl-red">${taken} taken</span>`
                : `<span class="hl-red">All ${taken} taken</span> — try another word`
      );
      render();
      return;
    }
    done++;
    const i = rows.findIndex(r => r.name === d.name);
    if (i !== -1) rows[i] = { name: d.name, com: d.com, io: d.io, _state: 'done' };
    setStatus(`<span class="spinner"></span> Checking <span class="hl">${done}</span><span class="dim"> / ${variants.length}</span>`);
    render();
  };

  sse.onerror = () => {
    if (sse) { sse.close(); sse = null; }
    live = false;
    document.getElementById('goBtn').disabled = false;
    document.getElementById('goBtn').textContent = 'Check';
    setStatus('Connection error — try again');
  };
}

document.getElementById('word').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
